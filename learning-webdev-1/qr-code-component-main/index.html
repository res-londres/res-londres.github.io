<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, intial-scale=1">
    <link rel="icon" href="./assets/images/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="stylesheet" href="./css/style.css" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>QR Code Component</title>

<body>
    <main>
        <section class="card">
            <img src="./assets/images/image-qr-code.png" alt="Frontend Mentor QR Code">

    <footer>

        <p>Coded by <a href="https://github.com/res-londres">res-londres</a></p>
    </footer>
