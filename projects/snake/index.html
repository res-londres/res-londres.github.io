<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">   
    <title>Snake | Projects | Res Londres</title>
</head>
<body>
    <header>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/projects.html">Projects</a>
            <a href="/news.html">News</a>
            <a href="/blogs.html">Blogs</a>
        </nav>
    </header>
    <main>
        <section class="path">
            <a class="path__component" href="/projects.html">Projects</a> /
            <a class="path__component" href="/projects/snake/index.html">Snake</a>
        </section>

        <section class="body body--centered">
        <div class="snake">
            <div class="snake__header">
                <div class="snake__stat snake__stat--left">
                    <i class="fa-solid fa-star"></i>
                    <span class="snake__score" id="snake__score">0</span>
                </div>
                <span class="snake__status" id="snake__status">SNAKE!</span>
                <div class="snake__stat snake__stat--right">
                    <i class="fa-solid fa-trophy"></i>
                    <span class="snake__highscore" id="snake__highscore">0</span>
                </div>
            </div>
            <canvas id="snake__canvas" width="450" height="450"></canvas>
            <div class="snake__footer">
                <span class="snake__message" id="snake__message">Press any arrow key to start</span>
            </div>
            <div class="snake__controller">
                <div class="snake__controller__keys">
                    <button class="key key--up">
                        <i class="fa-solid fa-caret-up"></i>
                    </button>
                    <button class="key key--left">
                        <i class="fa-solid fa-caret-left"></i>
                    </button>
                    <button class="key key--disabled" disabled>
                        <i class="fa-solid fa-circle"></i>
                    </button>
                    <button class="key key--right">
                        <i class="fa-solid fa-caret-right"></i>
                    </button>
                    <button class="key key--down">
                        <i class="fa-solid fa-caret-down"></i>
                    </button>
                </div>
            </div>
        </div>
        </section>
    </main>
    <footer>
        <nav class="social-links">
            <a href="https://github.com/res-londres">Github</a>
            <a href="https://www.facebook.com/res.londres">Facebook</a>
            <a href="https://instagram.com/lxn.res">Instagram</a>
            <a href="https://open.spotify.com/user/31lptwpj3ltqniw6xmwyfdegchy4?si=29dc62a4bcf243a3">Spotify</a>
        </nav>
        <span>© 2026 Res Londres</span>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
