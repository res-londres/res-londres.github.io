<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Calculator | Projects | Res Londres</title>
</head>
<body>
    <header>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/projects.html">Projects</a>
        </nav>
    </header>
    <main>
        <div class="calculator">
            <div class="calculator__display">
                <p class="calculator__expression">1+1</p>
                <p class="calculator__result">2</p>
            </div>
            <div class="calculator__buttons">
                <button class="button js-button button--light button--operator" type="button" data-operation="add">+</button>
                <button class="button js-button button--light button--operator" type="button" data-operation="subtract">−</button>
                <button class="button js-button button--light button--operator" type="button" data-operation="multiply">×</button>
                <button class="button js-button button--light button--operator" type="button" data-operation="division">÷</button>

                <button class="button js-button button--dark" type="button" data-number="7">7</button>
                <button class="button js-button button--dark" type="button" data-number="8">8</button>
                <button class="button js-button button--dark" type="button" data-number="9">9</button>
                <button class="button js-button button--dark" type="button" data-number="4">4</button>
                <button class="button js-button button--dark" type="button" data-number="5">5</button>
                <button class="button js-button button--dark" type="button" data-number="6">6</button>
                <button class="button js-button button--dark" type="button" data-number="1">1</button>
                <button class="button js-button button--dark" type="button" data-number="2">2</button>
                <button class="button js-button button--dark" type="button" data-number="3">3</button>
                <button class="button js-button button--dark" type="button" data-number="0">0</button>

                <button class="button js-button button--dark" type="button">.</button>
                <button class="button js-button button--dark" type="button">C</button>
                <button class="button js-button button--light button--equal" type="button">=</button>
            </div>
        </div>
    </main>
    <footer>
        <nav class="social-links">
            <a href="https://github.com/res-londres">Github</a>
            <a href="https://open.spotify.com/user/31lptwpj3ltqniw6xmwyfdegchy4?si=29dc62a4bcf243a3">Spotify</a>
            <a href="https://instagram.com/lxn.res">Instagram</a>
            <a href="https://www.facebook.com/res.londres">Facebook</a>
        </nav>
        <span>© 2026 Res Londres</span>
    </footer>
</body>
</html>
