<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Calculator | Projects | Res Londres</title>
</head>
<body>
    <header>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/projects.html">Projects</a>
            <a href="/news.html">News</a>
            <a href="/blog.html">Blog</a>
        </nav>
    </header>
    <main>
        <div class="path">
            <a class="path__component" href="/projects.html">Projects</a> /
            <a class="path__component" href="/projects/calculator/index.html">Calculator</a>
        </div>

        <div class="project">
            <div class="calculator" id="calculator">
                <div class="calculator__display">
                    <p class="calculator__expression" id="calculator__expression"><span></span></p>
                    <p class="calculator__result" id="calculator__result"><span></span></p>
                </div>
                <div class="calculator__buttons">
                    <button class="button js-button button--light button--operator" type="button" data-role="operator" data-function="add" data-value="+">+</button>
                    <button class="button js-button button--light button--operator" type="button" data-role="operator" data-function="subtract" data-value="−">−</button>
                    <button class="button js-button button--light button--operator" type="button" data-role="operator" data-function="multiply" data-value="×">×</button>
                    <button class="button js-button button--light button--operator" type="button" data-role="operator" data-function="divide" data-value="÷">÷</button>
    
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="7">7</button>
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="8">8</button>
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="9">9</button>
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="4">4</button>
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="5">5</button>
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="6">6</button>
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="1">1</button>
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="2">2</button>
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="3">3</button>
                    <button class="button js-button button--dark" type="button" data-role="number" data-value="0">0</button>
    
                    <button class="button js-button button--dark" type="button" data-role="misc" data-function="decimal-point" data-value=".">.</button>
                    <button class="button js-button button--dark" type="button" data-role="misc" data-function="clear" data-value="">C</button>
                    <button class="button js-button button--light button--equal" type="button" data-role="misc" data-function="equal" data-value="=">=</button>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <nav class="social-links">
            <a href="https://github.com/res-londres">Github</a>
            <a href="https://www.facebook.com/res.londres">Facebook</a>
            <a href="https://instagram.com/lxn.res">Instagram</a>
            <a href="https://open.spotify.com/user/31lptwpj3ltqniw6xmwyfdegchy4?si=29dc62a4bcf243a3">Spotify</a>
        </nav>
        <span>© 2026 Res Londres</span>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
