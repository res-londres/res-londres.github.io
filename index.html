<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/tags.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
    <title>Home | Res Londres</title>
</head>
<body>
    <header>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/projects.html">Projects</a>
            <a href="/news.html">News</a>
            <a href="/blogs.html">Blogs</a>
        </nav>
    </header>
    <main>
        <section class="profile">
            <div class="profile__pic">
                <img src="/img/res.jpg" height="200px" width="200px">
            </div>
            <span class="profile__fname">res</span>
            <span class="profile__lname">londres</span>
            <span class="profile__note"></span>
            <span class="profile__bio"></span>
        </section>
        <section class="body">
        <section class="recents">
            <section class="recents__left">
                <div class="recent">
                    <div class="recent__header">
                        <span class="recent__title">Recent Projects</span>
                        <a class="recent__redirect" href="/projects.html">See all</a>
                    </div>
                    <div class="recent__body projects" id="recent__body--projects">
                        <span class="empty">No recent projects...</span>
                    </div>
                </div>
                <div class="recent">
                    <div class="recent__header">
                        <span class="recent__title">Recent Blogs</span>
                        <a class="recent__redirect" href="/blogs.html">See all</a>
                    </div>
                    <div class="recent__body blogs" id="recent__body--blogs">
                        <span class="empty">No recent blogs...</span>
                    </div>
                </div>
            </section>
            <section class="recents__right">
                <div class="recent">
                    <div class="recent__header">
                        <span class="recent__title">Recent News</span>
                        <a class="recent__redirect" href="/news.html">See all</a>
                    </div>
                    <div class="recent__body recent__body--stacked news" id="recent__body--news">
                        <span class="empty">No recent news...</span>
                    </div>
                </div>
            </section>
        </section>
        </section>
    </main>
    <footer>
        <nav class="social-links">
            <a href="https://github.com/res-londres">Github</a>
            <a href="https://www.facebook.com/res.londres">Facebook</a>
            <a href="https://instagram.com/lxn.res">Instagram</a>
            <a href="https://open.spotify.com/user/31lptwpj3ltqniw6xmwyfdegchy4?si=29dc62a4bcf243a3">Spotify</a>
        </nav>
        <span>© 2026 Res Londres</span>
    </footer>

    <div class="modal" id="modal">
        <div class="modal__overlay" data-action="closeModal"></div>
        <div class="modal__card">
            <div class="modal__content" id="modal__content">
                <!-- js can put something here -->
            </div>
        </div>
    </div>

    <script type="module">
        import { renderList } from '/js/list-renderer.js';
        import { createProjectCard, createNewsStrip, createBlogStrip } from '/js/list-creator.js';
        import { clickEventListeners } from '/js/event-listeners.js';
        
        clickEventListeners();

        const recentProjectsContainer = document.getElementById('recent__body--projects');
        const recentNewsContainer = document.getElementById('recent__body--news');
        const recentBlogsContainer = document.getElementById('recent__body--blogs');
        renderList(recentProjectsContainer, '/json/projects.json', createProjectCard, 3);
        renderList(recentNewsContainer, '/json/news.json', createNewsStrip, 3);
        renderList(recentBlogsContainer, '/json/blogs.json', createBlogStrip, 3);
    </script>
</body>
</html>
